# Saves the newest official weather for La Porte (NWS forecast, alerts, forecaster
# discussion, storm and flooding-rain outlooks) into nws-snapshot.json. The Daily Scoop
# is written from this file every morning. The morning post task starts this job itself
# (workflow_dispatch) so it never waits on GitHub's schedule, which can run hours late;
# the schedule below is only a backup copy for the same morning.
name: NWS weather snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "5 10 * * *"   # 5:05 AM Central (4:05 AM in winter), backup only
  push:
    branches: [main]
    paths:
      - scripts/nws_snapshot.py
      - .github/workflows/nws-snapshot.yml

permissions:
  contents: write

concurrency:
  group: nws-snapshot
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Ask NWS, SPC and WPC for the latest
        run: python3 scripts/nws_snapshot.py
      - name: Save the snapshot
        # The newest snapshot always wins: each try starts from the latest main and puts
        # this run's file on top, so two runs close together can't block each other.
        run: |
          cp nws-snapshot.json "$RUNNER_TEMP/nws-snapshot.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="NWS weather snapshot ($(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z'))"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/nws-snapshot.json" nws-snapshot.json
            git add nws-snapshot.json
            if git diff --cached --quiet; then
              echo "Nothing new to save."
              exit 0
            fi
            git commit -q -m "$msg"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
