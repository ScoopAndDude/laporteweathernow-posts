# Storm grid TEST (Oct. 19, 2026; branch storm-records only, nothing live): builds the regional grid files the
# Hard Hat sender will read (scripts/storm_grid.py) for the days in storm-records/grid-test.json, checks them
# against the per-lot engine's results, notes when NOAA's newest files appeared, and commits it all to
# storm-records/out/grid/ on this branch.
name: Storm grid (test)

on:
  push:
    branches: [storm-records]
    paths:
      - scripts/storm_grid.py
      - scripts/storm_records/grid_compare.py
      - storm-records/grid-test.json
      - .github/workflows/storm-grid-test.yml

permissions:
  contents: write

concurrency:
  group: storm-grid-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storm-records
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers (GRIB2 and GeoTIFF)
        run: pip install -q numpy pygrib rasterio
      - name: Start fresh
        run: rm -rf storm-records/out/grid
      - name: When NOAA's newest files appeared
        run: python3 scripts/storm_grid.py latency storm-records/out/grid
      - name: Build the test days
        run: |
          DAYS=$(python3 -c "import json;print(' '.join(json.load(open('storm-records/grid-test.json'))['days']))")
          python3 scripts/storm_grid.py backfill storm-records/out/grid $DAYS
      - name: Compare with the per-lot engine
        if: always()
        run: python3 scripts/storm_records/grid_compare.py storm-records/out/grid
      - name: Try the hourly run (twice) on today's data
        if: always()
        run: |
          D="$RUNNER_TEMP/live"; O=storm-records/out/grid/live-update; rm -rf "$D"; mkdir -p "$O"
          t0=$(date +%s); python3 scripts/storm_grid.py update "$D"; t1=$(date +%s)
          cp "$D/log.txt" "$O/log-1.txt"
          python3 scripts/storm_grid.py update "$D"; t2=$(date +%s)
          cp "$D/log.txt" "$O/log-2.txt"
          cp "$D/index.json" "$O/"
          cp "$D/radar/2-3.json" "$O/radar-2-3.json" 2>/dev/null || true
          ls "$D/snow" > "$O/snow-days.txt" 2>/dev/null || true
          for d in "$D"/snow/*/; do [ -f "$d/meta.json" ] && cp "$d/meta.json" "$O/meta-$(basename "$d").json"; done
          { echo "first run $((t1 - t0)) s, second run $((t2 - t1)) s"; du -sh "$D" "$D/radar" "$D/snow" 2>/dev/null; } > "$O/sizes.txt"
      - name: Save results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storm-records/out/grid
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Storm grid test results ($(TZ=America/Chicago date '+%b %-d, %-I:%M %p %Z'))"
          for i in 1 2 3; do
            if git push -q origin HEAD:storm-records; then exit 0; fi
            git pull -q --rebase origin storm-records
          done
          exit 1
