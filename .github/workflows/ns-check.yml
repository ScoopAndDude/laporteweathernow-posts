name: ns-check (one-off)
on: workflow_dispatch
jobs:
  ns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          dig +short NS laporteweathernow.com
          echo ---; dig +short MX laporteweathernow.com
          echo ---; dig +short TXT laporteweathernow.com | grep -i spf || echo "no spf"
