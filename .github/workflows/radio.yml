# Weather radio: records the La Porte County broadcast for the Alerts page's radio player.
#
# Every 15 minutes it writes the broadcast from the newest NWS alerts, airport reading and forecast
# (plus today's Daily Scoop). Only when the words changed does it record: Kokoro-82M, a free
# open-source voice (Apache 2.0), reads it into an MP3. The MP3 and radio.json go to the "radio"
# branch, which keeps just the newest recording (no history), and the page plays it from
# raw.githubusercontent.com. Warnings issued between recordings are read on the page itself.
#
# Run it by hand: Actions > Weather radio > Run workflow. "force" records even if nothing changed;
# "check" also turns the recording back into text (faster-whisper) and prints what a listener hears.
name: Weather radio

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Record even if nothing changed"
        type: boolean
        default: false
      check:
        description: "Check the words (speech-to-text) after recording"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/radio_broadcast.py", ".github/workflows/radio.yml"]

permissions:
  contents: write

concurrency:
  group: weather-radio
  cancel-in-progress: false

jobs:
  radio:
    name: Weather radio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the broadcast
        id: script
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python3 scripts/radio_broadcast.py script "$RUNNER_TEMP/script.json" $FORCE

      - name: Voice cache
        if: steps.script.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kokoro-voice-${{ runner.os }}-py312-v1

      - name: Install the voice
        if: steps.script.outputs.changed == 'true'
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null)
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
          python3 -m spacy download en_core_web_sm -q || true

      - name: Record
        if: steps.script.outputs.changed == 'true'
        run: python3 scripts/radio_broadcast.py record "$RUNNER_TEMP/script.json" "$RUNNER_TEMP/radio"

      - name: Check the words
        if: steps.script.outputs.changed == 'true' && inputs.check
        run: |
          pip install -q faster-whisper
          python3 scripts/radio_broadcast.py check "$RUNNER_TEMP/radio"

      - name: Publish to the radio branch
        if: steps.script.outputs.changed == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/radio"
          rm -f script.json
          git init -q -b radio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Weather radio $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" radio:radio
          echo "Published $(ls *.mp3) ($(du -h *.mp3 | cut -f1))."
