name: History of Halloween documentary voice (one-off, Oct. 2026)

# Records the documentary's narration (tools/video/halloween-doc/lines.json) with Chatterbox (Resemble AI, MIT),
# the voice Scoop picked for sounding more human, in four parallel parts, then joins them and saves the
# recording on the halloween-doc branch. Runs only on that branch, only when the words change, and only
# re-records lines that changed. Nothing is posted.
on:
  workflow_dispatch:
    inputs:
      save_run_id:
        description: "Only join and save the parts of this earlier run (skip recording)"
        required: false
        default: ""
  push:
    branches: [halloween-doc]
    paths:
      - tools/video/halloween-doc/lines.json
      - tools/video/halloween-doc/voice.py
      - .github/workflows/halloween-doc-voice.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: halloween-doc-voice
  cancel-in-progress: true

jobs:
  record:
    if: ${{ !inputs.save_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Voice cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: chatterbox-voice-${{ runner.os }}-py311-v1

      - name: Install the voice
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null)
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts faster-whisper soundfile numpy

      - name: Record
        env:
          VOICE_ENGINE: chatterbox
          VOICE_PART: ${{ matrix.part }}/4
        run: python3 tools/video/halloween-doc/voice.py 2>&1 | tee tools/video/halloween-doc/voice-log-${{ matrix.part }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voice-part-${{ matrix.part }}
          path: |
            tools/video/halloween-doc/voice/*.flac
            tools/video/halloween-doc/voice/part-${{ matrix.part }}.json
            tools/video/halloween-doc/voice-log-${{ matrix.part }}.txt
          if-no-files-found: error

  save:
    needs: record
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: voice-part-*
          path: parts
          merge-multiple: true

      - name: Join the parts
        run: |
          mkdir -p tools/video/halloween-doc/voice
          find parts -type f | head -20
          cp -r parts/voice/* tools/video/halloween-doc/voice/
          cat parts/voice-log-*.txt > tools/video/halloween-doc/voice-log.txt || true
          python3 tools/video/halloween-doc/voice.py merge

      - name: Save the recording on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/video/halloween-doc/voice-log-*.txt
          git add -A tools/video/halloween-doc/voice tools/video/halloween-doc/voice-log.txt || true
          git commit -q -m "Halloween documentary: the narration (Chatterbox)" || echo "nothing new"
          for i in 1 2 3; do git pull -q --rebase origin halloween-doc && git push -q origin HEAD:halloween-doc && break; sleep 5; done
