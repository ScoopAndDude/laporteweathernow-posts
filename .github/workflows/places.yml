# Builds the map squares that make laporteweathernow.com/camp-map (The Chase) load fast: campsites,
# rest areas, dog parks, springs, water, dump stations, showers, laundry, libraries, propane and truck
# stops for the whole U.S., from OpenStreetMap (via Geofabrik). Runs once a week; each run replaces the
# "places" branch, so old copies don't pile up. Map data (c) OpenStreetMap contributors, ODbL.
name: Camp map places from OpenStreetMap

on:
  schedule:
    - cron: "23 8 * * 1"   # Monday 3:23 AM Central (2:23 AM in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/places_build.py
      - .github/workflows/places.yml

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          osmium --version | head -1
      - name: Make room for the downloads
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$RUNNER_TEMP" | tail -1
      - name: Build the map squares
        run: python3 scripts/places_build.py "$RUNNER_TEMP/places"
      - name: Replace the places branch with the new squares
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/places/out"
          git init -q -b places
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Camp map places from OpenStreetMap ($(TZ=America/Chicago date '+%Y-%m-%d'))"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" places:places
