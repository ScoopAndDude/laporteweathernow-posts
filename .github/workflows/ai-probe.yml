# Test run of the Forecast Race on this branch only (backfill + today), before it goes on main.
name: AI probe
on:
  push:
    branches: [ai-probe]
    paths: [scripts/forecast_race.py, .github/workflows/ai-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Backfill and save today's forecasts (test)
        run: |
          pip install --quiet pygrib numpy 2>&1 | tail -2
          mkdir -p probe
          ( python3 scripts/forecast_race.py backfill 2026-09-27 2026-10-05 && python3 scripts/forecast_race.py force ) > probe/race-log.txt 2>&1 || true
          cp race.json probe/race.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/
          git commit -q -m "Forecast Race test results" && git push -q origin HEAD:ai-probe || true
