# Daily health check for laporteweathernow.com: every page and file loads, version
# stamps match, the data files are fresh, the Daily Scoop is on time, and no GitHub job
# keeps failing. Saves health.json; the weekly check-up reads it.
# When it finds something readers would notice ("urgent" in health.json), the last step
# fails on purpose so GitHub emails Scoop that morning. Run it by hand with "test_alert"
# to send a test email.
name: Site health check

on:
  schedule:
    - cron: "10 13 * * *"   # 8:10 AM Central (7:10 AM in winter), after the morning Scoop and its backup
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test email (nothing is wrong)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/site_health.py
      - .github/workflows/site-health.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: site-health
  cancel-in-progress: true

jobs:
  check:
    name: Daily site check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check the site and its data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/site_health.py
      - name: Save health.json
        run: |
          cp health.json "$RUNNER_TEMP/health.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="Site health check ($(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z'))"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/health.json" health.json
            git add health.json
            if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
            git commit -q -m "$msg"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Email Scoop if something needs a look
        env:
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          with open(os.path.join(os.environ["RUNNER_TEMP"], "health.json"), encoding="utf-8") as fh:
              urgent = json.load(fh).get("urgent") or []
          if os.environ.get("TEST_ALERT") == "true":
              urgent = ["TEST ONLY, nothing is wrong: this is what an email from the daily site check looks like."]
          if not urgent:
              print("Nothing urgent.")
              sys.exit(0)
          lines = ["## Something on laporteweathernow.com needs a look", ""] + [f"- {u}" for u in urgent]
          lines += ["", "Full report: health.json in this repository."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          for u in urgent:
              print(f"::error title=Site check::{u}")
          sys.exit(1)
          EOF
